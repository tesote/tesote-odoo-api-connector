[project]
name = "tesote-odoo-connector"
version = "18.0.1.0.0"
description = "Odoo 18.0 connector for tesote.com API v2.0.0"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
    "sentry-sdk>=2.0.0",
    "colorlog>=6.8.0",  # Colored logging for better readability
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "responses>=0.22.0",
    "freezegun>=1.2.0",
    "ruff>=0.8.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "pre-commit>=3.5.0",
    "debugpy>=1.8.0",  # Python debugger for VSCode/PyCharm
    "ipdb>=0.13.13",   # IPython debugger for interactive debugging
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "--disable-warnings",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
]

[tool.coverage.run]
source = ["."]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
known_odoo = ["odoo", "odoo.addons"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "ODOO", "FIRSTPARTY", "LOCALFOLDER"]
skip = ["migrations", ".venv", "venv"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["migrations", ".venv", "venv"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # function calls in argument defaults
    "N802",  # function name should be lowercase (Odoo uses mixedCase)
    "N806",  # variable in function should be lowercase (Odoo conventions)
    "N999",  # Invalid module name - Odoo uses hyphenated module names
    "B018",  # Useless expression - __manifest__.py dict is used by Odoo
    "SIM105", # Use contextlib.suppress - prefer explicit try/except for clarity
    "B904",  # Use raise...from - not always needed for custom exceptions
    "SIM108", # Use ternary operator - prefer explicit if/else for readability
    "SIM102", # Use single if - nested ifs are sometimes clearer
    "B027",  # Empty abstract method - intentional for optional overrides
    "B007",  # Unused loop variable - keeping for tuple unpacking clarity
    "F841",  # Unused variable - some are intentionally defined for documentation
    "UP008", # Use super() - Odoo requires explicit super() for compatibility
    "B023",  # Function does not bind loop variable - known Python lambda issue
    "C403",  # Unnecessary list comprehension - sometimes clearer than set comp
    "C401",  # Unnecessary generator - sometimes clearer for readability
    "F811",  # Redefinition of unused - can occur in Odoo models with overrides
    "E402",  # Module level import not at top - needed for test mocking setup
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__.py
"tests/*" = ["N802", "N806"]  # naming conventions relaxed in tests
