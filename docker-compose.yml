services:
  db:
    image: postgres:15-alpine
    container_name: tesote_postgres
    environment:
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_DB=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 5s
      timeout: 5s
      retries: 5

  odoo:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: tesote_odoo:dev
    container_name: tesote_odoo
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"      # Odoo web interface
      - "8072:8072"      # Longpolling port
      - "5678:5678"      # Debugger port (debugpy)
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
      - DB_NAME=tesote_dev
      - ODOO_ENV=production       # Controls verbose logging in tesote_connector
      - ENABLE_DEBUGPY=true        # Enable remote debugging
      - PYTHONUNBUFFERED=1         # Force Python to output everything immediately
      - LOG_LEVEL=debug            # Set Odoo log level
    volumes:
      # Mount our module (read-write for hot reloading!)
      - ./:/mnt/extra-addons/tesote_connector
      # Mount config
      - ./config/odoo.conf:/etc/odoo/odoo.conf:ro
      # Filestore
      - odoo_filestore:/var/lib/odoo
      # Backups
      - ./backups:/mnt/backups
    command: odoo --dev=all --log-level=debug --workers=0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8069/web/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tesote_pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@tesote.com
      - PGADMIN_DEFAULT_PASSWORD=admin
      - PGADMIN_CONFIG_SERVER_MODE=False
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
    ports:
      - "5050:80"
    depends_on:
      - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  odoo_filestore:
  pgadmin_data:

networks:
  default:
    name: tesote_network
